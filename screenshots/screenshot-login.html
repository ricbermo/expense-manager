<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gastos — Ingresar</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --background: #f8fafc;
      --foreground: #020617;
      --card: #ffffff;
      --card-foreground: #0f172a;
      --primary: #0f172a;
      --primary-foreground: #f8fafc;
      --muted: #eef2f7;
      --muted-foreground: #475569;
      --border: #dbe4ee;
      --input: #dbe4ee;
      --ring: #1e3a8a;
    }

    body {
      font-family: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: var(--background);
      color: var(--foreground);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .phone-frame {
      width: 100%;
      max-width: 390px;
      min-height: 100vh;
      background: var(--background);
      position: relative;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .login-card {
      width: 100%;
      max-width: 24rem;
      background: var(--card);
      border-radius: 1.125rem;
      border: 1px solid var(--border);
      box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05);
      padding: 1.5rem;
    }

    .login-card h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.025em;
      color: var(--foreground);
    }
    .login-card .login-desc {
      margin-top: 0.25rem;
      font-size: 0.875rem;
      color: var(--muted-foreground);
    }

    .login-form {
      margin-top: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .form-group { display: flex; flex-direction: column; gap: 0.375rem; }
    .form-label {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--foreground);
    }
    .form-input {
      width: 100%;
      height: 2.5rem;
      padding: 0 0.75rem;
      border-radius: 0.625rem;
      border: 1px solid var(--input);
      background: transparent;
      font-size: 0.875rem;
      font-family: inherit;
      color: var(--foreground);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .form-input::placeholder { color: var(--muted-foreground); }
    .form-input:focus {
      border-color: var(--ring);
      box-shadow: 0 0 0 2px rgba(30,58,138,0.15);
    }

    .btn-submit {
      width: 100%;
      height: 2.5rem;
      border-radius: 0.625rem;
      background: var(--primary);
      color: var(--primary-foreground);
      font-size: 0.875rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      font-family: inherit;
      margin-top: 0.25rem;
    }
    .btn-submit:hover { opacity: 0.85; }
    .btn-submit:active { transform: translateY(1px); }

    .login-footer {
      text-align: center;
      margin-top: 1.25rem;
      font-size: 0.6875rem;
      color: var(--muted-foreground);
      line-height: 1.5;
    }

    .brand-mark {
      margin-top: 2rem;
      text-align: center;
      font-size: 0.6875rem;
      color: var(--muted-foreground);
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-in {
      animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
    }
    .delay-1 { animation-delay: 0.05s; }
    .delay-2 { animation-delay: 0.1s; }
    .delay-3 { animation-delay: 0.15s; }
  </style>
</head>
<body>
  <div class="phone-frame">
    <section class="login-card animate-in delay-1">
      <h1>Ingresar</h1>
      <p class="login-desc">Accede con tu correo y contraseña para continuar.</p>

      <form class="login-form animate-in delay-2">
        <div class="form-group">
          <label class="form-label" for="email">Correo</label>
          <input class="form-input" type="email" id="email" placeholder="tu@correo.com" />
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Contraseña</label>
          <input class="form-input" type="password" id="password" placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;" />
        </div>
        <button type="submit" class="btn-submit">Ingresar</button>
      </form>

      <div class="login-footer animate-in delay-3">
        <p>Si no tienes cuenta, contacta al administrador.</p>
      </div>
    </section>

    <p class="brand-mark animate-in delay-3">Gastos</p>
  </div>
</body>
</html>
